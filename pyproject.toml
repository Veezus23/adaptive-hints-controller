[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "adaptive-hints-regrouping"
version = "0.3.1"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["adaptive_hints_v03*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_data: authentic frozen development records", "software_fixture: typed state/validator checks only; never learner/session observations"]
